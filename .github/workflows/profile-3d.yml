name: Generate 3D Contribution Profile

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: profile-readme-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated profile
        run: |
          git config --local user.email "126380366+jyh20030112@users.noreply.github.com"
          git config --local user.name "jyh20030112"
          git add profile-3d-contrib/
          git diff --staged --quiet || git commit -m "Generate 3D contribution profile"
          git push
