name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_stats.py"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CJK fonts for Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei fonts-wqy-zenhei

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate stats and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_stats.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md assets/
          git diff --staged --quiet || git commit -m "📊 Update profile stats [auto]"
          git push
